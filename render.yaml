services:
  - type: web
    name: linkshotnerpro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: TOKEN
        sync: false
      - key: BASE_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: APP_NAME
        value: LinkShotnerPro
      - key: BOT_BANNER_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
